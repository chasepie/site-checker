<div class="login">
  <form class="card login-card" [formRoot]="loginForm">
    <div class="card-body">
      <h2 class="h4 card-title mb-3">Log in to Site Checker</h2>
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" autocomplete="current-password"
        [formField]="loginForm.password" [class.is-invalid]="passwordError()"
        [attr.aria-invalid]="passwordError() ? true : null"
        [attr.aria-describedby]="passwordError() ? 'password-error' : null">
      @if (passwordError(); as message) {
      <div id="password-error" class="invalid-feedback" role="alert">{{ message }}</div>
      }
      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loginForm().submitting()">
        @if (loginForm().submitting()) {
        <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
        }
        Log in
      </button>
    </div>
  </form>
</div>
